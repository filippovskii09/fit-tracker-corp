name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".diffcovguardrc"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".diffcovguardrc"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend-checks:
    name: React/Vite Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Root Tools
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Install Dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format Check
        run: npx prettier --check .

      - name: Build (TypeCheck & Vite)
        run: npm run build

      - name: Test with Coverage
        run: npm run test:cov

      - name: Check diff coverage
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run diff:cov
          else
            npm run diff:cov -- --no-comment
          fi
